<script>
const M=(q,o,a)=>({k:'mc',q,o,a}),F=(q,a)=>({k:'fill',q,a}),O=a=>({k:'order',a}),X=p=>({k:'match',p});
const LV=[
{id:'b',n:'Beginner',mods:[{t:'Modul 1: Identitas & Hubungan',th:[
{t:'Introducing Yourself',l:'<b>Salam & perkenalan</b><br>Hello, I am Sari. / My name is Sari. / Nice to meet you.<br><br><b>Pertanyaan umum</b><br>What is your name? → My name is Sari.<br>How old are you? → I am 16 years old.<br>Where are you from? → I am from Indonesia.<br>Where do you live? → I live in Samarinda.<br><br><b>To be</b>: I <b>am</b>, you/we/they <b>are</b>, he/she/it <b>is</b>.<br>Negatif: I am <b>not</b>, he is <b>not</b>. Tanya: <b>Are</b> you a student?<br><br><b>Asal negara</b>: Indonesia → Indonesian, Japan → Japanese, Malaysia → Malaysian.',bank:[
M('What is your name?',['I am fine.','My name is Rina.','I am from Bali.'],1),
M('How old are you?',['I am 17 years old.','I am from Japan.','I am a teacher.'],0),
F('Where are you from? — I ___ from Indonesia.','am'),
M('She ___ from Malaysia.',['am','are','is'],2),
F('They ___ students. (is/are)','are'),
O('Where do you live'),
O('I am not from Japan'),
X([['name','nama'],['age','umur'],['country','negara'],['live','tinggal']]),
M('He is from Japan. He is ___.',['Japan','Japanese','Japaneses'],1),
M('Pertanyaan untuk menanyakan asal negara:',['Where are you from?','What are you from?','How are you from?'],0),
F('Nice to ___ you.','meet')]},
{t:'Family & Friends',l:'<b>Keluarga</b>: father (ayah), mother (ibu), brother (saudara laki-laki), sister (saudara perempuan), grandfather (kakek), grandmother (nenek), uncle (paman), aunt (bibi), cousin (sepupu).<br><br><b>Possessive</b>: my, your, his, her, our, their.<br>This is <b>my</b> mother. <b>Her</b> name is Dewi.<br><br><b>Kepemilikan dengan ’s</b><br>Budi’s sister = saudara perempuan Budi.<br><br><b>Mendeskripsikan teman</b>: My friend is tall / kind / funny / smart. He has short black hair.',bank:[
X([['father','ayah'],['mother','ibu'],['brother','saudara laki-laki'],['sister','saudara perempuan']]),
M('This is Anna. ___ mother is a nurse.',['His','Her','Their'],1),
M('Tom and Ben are brothers. ___ father is a driver.',['Their','Her','My'],0),
F('I love ___ family. (my/me)','my'),
O('My sister is very smart'),
M('Saudara perempuan ibumu adalah your ...',['uncle','aunt','cousin'],1),
M('Budi’s sister artinya ...',['Saudara perempuan Budi','Budi adalah saudara perempuan','Budi dan saudara perempuan'],0),
F('Dina is my best ___. (teman)','friend'),
M('My friend is funny. Arti "funny":',['lucu','pendiam','tinggi'],0),
O('He has short black hair'),
F('This is my grandfather. ___ is 70 years old. (He/She)','he')]},
{t:'Hobbies & Interests',l:'<b>Hobi</b>: reading (membaca), swimming (berenang), watching movies, playing football, cooking (memasak), listening to music, drawing (menggambar).<br><br><b>Pola</b>: I <b>like / love / enjoy + verb-ing</b>.<br>I like reading books. She loves swimming.<br><br><b>Tidak suka</b>: I <b>don’t like</b> swimming. He <b>doesn’t like</b> cooking.<br><br><b>Tanya</b>: <b>Do you like</b> music? Yes, I do. / No, I don’t.<br><b>What do you do</b> in your free time? I usually watch movies.',bank:[
M('I like ___ books.',['read','reading','reads'],1),
M('She loves ___ in the sea.',['swim','swims','swimming'],2),
F('He ___ like cooking. (negatif)','doesn’t|does not'),
F('Do you like music? — Yes, I ___.','do'),
O('I enjoy listening to music'),
X([['reading','membaca'],['swimming','berenang'],['cooking','memasak'],['drawing','menggambar']]),
M('What do you do in your free time?',['I am fine.','I usually watch movies.','I am 15.'],1),
M('They ___ playing football on Sunday.',['likes','like','is like'],1),
M('He ___ drawing.',['love','loves','loving'],1),
O('She does not like cooking'),
M('Kalimat negatif yang benar:',['I no like swimming.','I don’t like swimming.','I not like swimming.'],1)]},
{t:'Daily Routines',l:'<b>Kegiatan harian</b>: wake up (bangun), take a shower (mandi), have breakfast, go to school/work, study, have lunch, go home, have dinner, go to bed.<br><br><b>Simple Present</b><br>Untuk kebiasaan. I/you/we/they + verb. He/she/it + verb<b>-s/-es</b>:<br>She <b>wakes</b> up at 6. He <b>goes</b> to school.<br><br><b>Keterangan waktu</b>: in the morning, in the afternoon, in the evening, at night, at 7 o’clock, every day.<br><br><b>Negatif & tanya</b>: I <b>don’t</b> watch TV. / She <b>doesn’t</b> watch TV. <b>Do</b> you wake up early? <b>Does</b> he study at night?',bank:[
M('She ___ up at 6 o’clock.',['wake','wakes','waking'],1),
M('I ___ breakfast every morning.',['have','has','having'],0),
F('He ___ to school by bus. (go)','goes'),
M('Urutan yang paling masuk akal:',['wake up → have breakfast → go to school','go to school → wake up → have breakfast','have breakfast → go to bed → wake up'],0),
X([['wake up','bangun tidur'],['take a shower','mandi'],['have lunch','makan siang'],['go to bed','pergi tidur']]),
O('My father goes to work at seven'),
F('Does she study at night? — No, she ___.','doesn’t|does not'),
M('We study ___ the morning.',['on','in','at'],1),
M('They ___ watch TV in the morning.',['doesn’t','don’t','isn’t'],1),
F('I go to bed ___ 10 o’clock. (at/in)','at'),
O('I do not eat lunch at home'),
M('He ___ his teeth every day.',['brush','brushes','brushing'],1)]}],
test:'auto'},{t:'Modul 2: Lingkungan Sekitar',th:[
{t:'Home & Rooms',l:'<b>Ruangan</b><br>living room (ruang tamu), bedroom (kamar tidur), kitchen (dapur), bathroom (kamar mandi), dining room (ruang makan), garage (garasi), garden (kebun)<br><br><b>Benda di rumah</b><br>sofa, table, chair, bed, lamp, fridge (kulkas), wardrobe (lemari pakaian), TV<br><br><b>There is / There are</b><br>There <b>is</b> a sofa in the living room. (satu benda)<br>There <b>are</b> two chairs in the kitchen. (lebih dari satu)<br>Negatif: There <b>isn’t</b> a TV. / There <b>aren’t</b> any lamps.<br>Tanya: <b>Is there</b> a fridge? <b>Are there</b> any chairs?<br><br><b>Kata depan tempat</b><br><b>in</b> = di dalam, <b>on</b> = di atas (menempel), <b>under</b> = di bawah, <b>next to</b> = di sebelah, <b>behind</b> = di belakang, <b>in front of</b> = di depan',bank:[
X([['kitchen','dapur'],['bedroom','kamar tidur'],['bathroom','kamar mandi'],['living room','ruang tamu']]),
M('We cook in the ___.',['bedroom','kitchen','garage'],1),
M('There ___ a sofa in the living room.',['is','are','am'],0),
M('There ___ three chairs in the kitchen.',['is','are','be'],1),
F('___ there a fridge in your house? (Is/Are)','is'),
M('The cat is ___ the table. (di bawah)',['on','under','next to'],1),
O('There are two beds in my room'),
F('The book is ___ the desk. (di atas meja)','on'),
M('There ___ any chairs in the garden.',['isn’t','aren’t','not'],1),
O('The bag is next to the door'),
M('Kamu tidur di ...',['bathroom','bedroom','dining room'],1),
M('___ any books on the shelf?',['Is there','Are there','There are'],1)]},
{t:'My Town / City',l:'<b>Tempat umum</b><br>supermarket, bank, school, hospital (rumah sakit), post office (kantor pos), bus station, market (pasar), park (taman), restaurant, mosque / church / temple<br><br><b>Menanyakan lokasi</b><br>Where is the bank? → It is <b>next to</b> the supermarket.<br>Is there a hospital near here? → Yes, there is. / No, there isn’t.<br><br><b>Kata depan lokasi</b><br><b>near</b> = dekat, <b>far from</b> = jauh dari, <b>opposite</b> = seberang, <b>between</b> = di antara, <b>on the corner</b> = di sudut<br><br><b>Mendeskripsikan kota</b><br>My town is <b>small / big / quiet / busy / beautiful</b>. There are many shops. There is a big park.',bank:[
X([['hospital','rumah sakit'],['supermarket','pasar swalayan'],['post office','kantor pos'],['park','taman']]),
M('You can save money in a ___.',['bank','hospital','market'],0),
M('Doctors and nurses work in a ___.',['hospital','restaurant','post office'],0),
M('Where is the bank? — It is ___ the supermarket.',['next to','in front','on'],0),
F('There ___ a big park in my town. (is/are)','is'),
M('The school is ___ the hospital. (seberang)',['opposite','between','under'],0),
O('Is there a hospital near here'),
M('My town is quiet. Artinya "quiet":',['ramai','tenang','besar'],1),
F('There ___ many shops in the city. (is/are)','are'),
O('The bank is on the corner'),
M('The post office is ___ the bank and the school.',['between','near to','in'],0),
M('Jawaban untuk "Is there a market near here?":',['Yes, there is.','Yes, it is.','Yes, I am.'],0)]},
{t:'Giving Directions',l:'<b>Kosakata arah</b><br>turn left (belok kiri), turn right (belok kanan), go straight (lurus), go past (melewati), cross the street (menyeberang jalan), at the corner (di sudut), traffic light (lampu lalu lintas), roundabout (bundaran)<br><br><b>Menanyakan arah</b><br>Excuse me, <b>how do I get to</b> the post office?<br>Where is the nearest bank?<br><br><b>Memberi arah</b><br><b>Go straight</b> for two blocks. <b>Turn left</b> at the traffic light. It is <b>on your right</b>.<br><br><b>Ungkapan sopan</b><br>Excuse me, ... / Thank you very much. / You are welcome.',bank:[
X([['turn left','belok kiri'],['turn right','belok kanan'],['go straight','lurus'],['cross the street','menyeberang jalan']]),
M('Excuse me, how do I ___ to the post office?',['go','get','turn'],1),
M('Kamu ingin memberi arah ke kiri. Kamu bilang:',['Turn right.','Turn left.','Go straight.'],1),
F('___ straight for two blocks. (Go/Turn)','go'),
O('Turn left at the traffic light'),
M('The bank is ___ your right.',['in','on','at'],1),
M('Kalimat pembuka yang sopan saat bertanya arah:',['Hey you!','Excuse me,','Give me a map.'],1),
F('Go ___ the bank. (melewati)','past'),
M('Go straight, then turn right. Artinya:',['lurus lalu belok kanan','belok kanan lalu lurus','mundur lalu belok kiri'],0),
O('The post office is on your left'),
M('Ucapan setelah ditolong menunjukkan arah:',['You are welcome.','Thank you very much.','Excuse me.'],1),
F('How do I ___ to the hospital? (get)','get')]},
{t:'Weather & Seasons',l:'<b>Cuaca</b><br>sunny (cerah), rainy (hujan), cloudy (berawan), windy (berangin), stormy (badai), hot (panas), cold (dingin), warm (hangat)<br><br><b>Menanyakan cuaca</b><br>What is the weather like today? → It is <b>sunny</b>.<br>How is the weather? → It is <b>cold</b>. / It is <b>raining</b>.<br><br><b>Musim</b><br>Indonesia: <b>dry season</b> (musim kemarau) dan <b>rainy season</b> (musim hujan).<br>Negara 4 musim: <b>spring</b> (semi), <b>summer</b> (panas), <b>autumn</b> (gugur), <b>winter</b> (dingin).<br><br><b>Pola kalimat</b><br>It <b>is</b> hot in summer. It <b>is</b> rainy in January. I like winter <b>because</b> it is cold.',bank:[
X([['sunny','cerah'],['rainy','hujan'],['cloudy','berawan'],['windy','berangin']]),
M('What is the weather like today? — It ___ sunny.',['is','are','am'],0),
M('In winter, the weather is usually ___.',['cold','hot','sunny'],0),
F('It is ___ today. Take an umbrella. (hujan)','rainy'),
O('It is very hot today'),
M('Indonesia punya dua musim: dry season dan ___ season.',['rainy','winter','spring'],0),
M('Urutan musim yang benar:',['spring, summer, autumn, winter','summer, spring, winter, autumn','winter, autumn, spring, summer'],0),
F('How is the ___ today? (cuaca)','weather'),
O('I like summer because it is sunny'),
M('Langit penuh awan. Cuacanya:',['sunny','cloudy','windy'],1),
M('Arti "dry season":',['musim hujan','musim kemarau','musim dingin'],1),
M('I like winter ___ it is cold.',['because','but','so'],0)]}],
test:'auto'},{t:'Modul 3: Kebutuhan Sehari-hari',th:[
{t:'Food & Drinks',l:'<b>Makanan & minuman</b><br>rice (nasi), chicken (ayam), fish (ikan), egg (telur), vegetables (sayur), fruit (buah), bread (roti), water (air), tea (teh), coffee (kopi), juice (jus), milk (susu)<br><br><b>Countable & uncountable</b><br>Bisa dihitung: an egg, two apples, three bananas.<br>Tidak bisa dihitung: rice, water, milk, bread → some rice, a glass of water.<br><b>How many</b> eggs? / <b>How much</b> milk?<br><br><b>Memesan makanan</b><br>Waiter: What <b>would you like</b>?<br>You: I <b>would like</b> a chicken sandwich and a glass of orange juice, <b>please</b>.<br>Can I have the bill, please?<br><br><b>Makanan favorit</b><br>My favorite food is fried rice. I love noodles. I don’t like spicy food.',bank:[
X([['rice','nasi'],['chicken','ayam'],['egg','telur'],['milk','susu']]),
M('I have ___ apple.',['a','an','some'],1),
M('We need ___ rice.',['a','an','some'],2),
M('___ eggs do you want?',['How much','How many','How long'],1),
M('___ water do you drink every day?',['How many','How much','How old'],1),

const tr=m=>/Invalid login/i.test(m)?'Email atau password salah.':/not confirmed/i.test(m)?'Email belum dikonfirmasi. Cek email konfirmasimu.':/rate limit/i.test(m)?'Terlalu banyak email dikirim. Coba lagi beberapa saat lagi.':/already registered/i.test(m)?'Email sudah terdaftar. Silakan masuk.':m;
function newPass(){if(document.getElementById('np'))return;vw='np';login()}
async function sendFp(){const em=val('em');if(!em)return login('Isi email dulu.');lastEm=em;
 const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
 if(error)return login(tr(error.message));
 login('✅ Jika email terdaftar, tautan reset sudah dikirim. Cek kotak masuk dan folder spam.',true)}
async function saveNp(){const a=document.getElementById('np').value,b=document.getElementById('np2').value;
 if(a.length<6)return login('Password minimal 6 karakter.');if(a!=b)return login('Kedua password tidak sama.');
 const{error}=await sb.auth.updateUser({password:a});if(error)return login(tr(error.message));
 try{history.replaceState(null,'',location.pathname)}catch(e){}
 const{data}=await sb.auth.getSession();vw='';mode='in';
 if(data.session)boot(data.session);else login('✅ Password diperbarui. Silakan masuk.',true)}
async function auth(){const em=val('em'),pw=document.getElementById('pw').value;lastEm=em;if(!em||pw.length<6)return login('Isi email dan password (min. 6 karakter).');
 let r;if(mode=='up'){const n=val('nm');if(!n)return login('Isi nama lengkap.');r=await sb.auth.signUp({email:em,password:pw,options:{data:{name:n,kelas:val('kl')}}})}else r=await sb.auth.signInWithPassword({email:em,password:pw});
 if(r.error)return login(tr(r.error.message));
 if(!r.data.session){mode='in';return login('Akun dibuat. Cek email untuk konfirmasi, lalu masuk.')}
 boot(r.data.session,true)}
async function google(){const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(r.error)login(tr(r.error.message))}
async function boot(se,chk){uid=se.user.id;const{data,error}=await sb.from('profiles').select('*').eq('id',uid).single();
 if(error||!data)return login('Profil tidak ditemukan. Pastikan supabase-setup.sql sudah dijalankan.');
 me=data;me.p=me.p||{};tb='b';if(me.role!='guru')await loadAS();
 if(chk&&who=='g'&&me.role!='guru'){await sb.auth.signOut();me=null;return login('Akun ini bukan akun guru. Gunakan tab Siswa.')}
 if(chk&&who=='s'&&me.role=='guru'){await sb.auth.signOut();me=null;return login('Akun ini terdaftar sebagai guru. Gunakan tab Guru.')}
 if(me.role!='guru')save();
 me.role=='guru'?teacher():home()}
async function logout(){await sb.auth.signOut();me=null;mode='in';login()}
let AS=[],TA=null;
async function loadAS(){try{const{data,error}=await sb.from('assignments').select('*').order('created_at',{ascending:false});AS=error?[]:(data||[])}catch(e){AS=[]}}
const RFX=/^([bei])(\d)(?:t(\d)|(T))$/;
function refInfo(ref){const m=RFX.exec(ref||'');if(!m)return null;const li='bei'.indexOf(m[1]),mi=+m[2],L=LV[li],M=L&&L.mods[mi];if(!M||!M.th)return null;
 if(m[4])return{li,mi,test:true,label:L.n+' · '+M.t+' · Modul Test'};const T=M.th[+m[3]];if(!T)return null;return{li,mi,ti:+m[3],test:false,label:L.n+' · '+T.t}}

function speakText(h){
 let t=h.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/\([^)]*\)/g,'').replace(/[“”"]/g,'').replace(/\.\.\./g,'').replace(/\s+([,;.!?])/g,'$1').replace(/\s[—–]\s/g,', ').replace(/(^|\s)-\w+(?:\/-\w+)*:\s*/g,'$1').replace(/\b\d+(?:st|nd|rd|th)\s+(?=[a-z])/gi,'').replace(/(\w)\/(\w)/g,'$1, $2').replace(/\s+/g,' ').trim();
 if(!t||/\/[a-zɪʃʒθðŋ]{1,3}\/\s*:/.test(t))return'';
 if(/[+=]/.test(t)&&t.indexOf(':')<0)return'';
 const ar=(t.match(/→/g)||[]).length;
 if(ar>=3&&t.includes(';'))return'';
 if(ar>=2&&(t.match(/:/g)||[]).length>=2)return'';
 if(/\b(?:present|past)\s+(?:simple|continuous|perfect)\b/i.test(t)&&ar)return'';
 const parts=t.split(/(\s\/\s|\s→\s|(?<=[.!?])\s+(?=[A-Z]))/),out=[];let prevEnd=true;
 for(let i=0;i<parts.length;i+=2){let sg=parts[i];const sep=i?parts[i-1]:'';
  const ci=sg.indexOf(':');
  if(ci>0&&ci<=60){const lf=sg.slice(0,ci),rt=sg.slice(ci+1),lw=lf.toLowerCase().split(/[^a-z’']+/);if(/[+=]/.test(lf)||lw.some(x=>IDW.has(x)||IDL.has(x)))sg=rt}
  sg=sg.replace(/\s+/g,' ').trim();
  if(!sg||/[+=✗✓]/.test(sg))continue;
  const w=sg.match(/[A-Za-z’']+/g)||[];
  if(!w.length||w.some(x=>IDW.has(x.toLowerCase())))continue;
  const ended=/[.!?,;:]$/.test(sg);sg=sg.replace(/[\s.!?,;:]+$/,'');if(!sg)continue;
  out.push({sg,j:out.length&&/^\s[\/→]\s$/.test(sep)&&!prevEnd?', ':'. '});prevEnd=ended}
 return out.map((o,i)=>(i?o.j:'')+o.sg).join('').trim()}

 document.querySelectorAll('.au.on').forEach(x=>x.classList.remove('on'));speechSynthesis.cancel();

function run(list,done,opts){let i=0,ok=0,wrong=[],stk=0,ans=false;const T=opts&&opts.time,t0=Date.now(),end=T?t0+T*1000:0;clearInterval(TMR);

   document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,os=document.querySelectorAll('.opt');os.forEach((x,k)=>{x.disabled=true;if(k!=e.a&&k!=j)x.classList.add('dim')});os[e.a].classList.add('ok');if(j!=e.a)b.classList.add('bad');fin(j==e.a,e.o[e.a])})}

   const chk=function(){const bt=document.getElementById('ck');if(bt.disabled)return;bt.disabled=true;document.getElementById('fi').disabled=true;const v=document.getElementById('fi').value.trim().toLowerCase().replace(/’/g,"'");fin(e.a.split('|').map(z=>z.toLowerCase().replace(/’/g,"'")).includes(v),e.a.split('|')[0])};

function detail(id){const x=all.find(i=>i.id==id);if(!x)return dash();const p=x.p||{},s=stat(x),w=why(s);
 let r=`<tr><td>Placement Test</td><td>${x.pt!=null?x.pt+'%':'-'}</td></tr>`;
 LV.forEach(L=>L.mods.forEach((m,mi)=>{if(!m.th)return;m.th.forEach((t,ti)=>{const v=p[`${L.id}${mi}t${ti}`];r+=`<tr><td>${L.n}: ${t.t}</td><td>${v!=null?v+'%':'-'}</td></tr>`});const v=p[`${L.id}${mi}T`];r+=`<tr><td><b>${L.n}: Modul Test</b></td><td>${v!=null?v+(v>=70?' ✅ Lulus':' ❌ Belum lulus'):'-'}</td></tr>`}));
 tshell(`<button onclick="dash()">← Kembali</button><div class=card><h2>${esc(x.name||'-')}</h2><p class=mu>${esc(x.email||'')}</p><p>${w?'⚠️ '+esc(w):'✅ Perkembangan baik'}</p><p class=mu>Terakhir aktif: ${fmtD(x)} · Progres ${pc(s.th,s.T)}% · Rata-rata ${s.avg==null?'-':s.avg+'%'}</p><div class=bar><i style="width:${pc(s.th,s.T)}%"></i></div></div><div class=card><h3>Pengaturan siswa</h3><label class=mu>Kelas / angkatan</label><input id=dk value="${esc(x.kelas||'')}" maxlength=30><label class=mu>Level aktif</label><select id=dl>${lvName.map((n,i)=>`<option value=${i} ${(x.lv||0)==i?'selected':''}>${n}</option>`).join('')}</select><div style="margin-top:10px"><button class=p onclick="saveS('${x.id}')">Simpan</button><button onclick="resetS('${x.id}')" style="color:var(--bad)">Reset progres</button></div><p id=dm class=mu></p></div><div class="card tbl"><h3>Riwayat nilai</h3><table style="min-width:0"><tr><th>Aktivitas</th><th>Nilai</th></tr>${r}</table></div>`)}
async function saveS(id){const x=all.find(i=>i.id==id),k=val('dk'),l=+document.getElementById('dl').value;
 const{data,error}=await sb.from('profiles').update({kelas:k||null,lv:l}).eq('id',id).select();
 const ok=!error&&data&&data.length;document.getElementById('dm').textContent=ok?'Tersimpan ✅':'Gagal menyimpan. Pastikan supabase-update-1.sql sudah dijalankan.'+(error?' ('+error.message+')':'');if(ok){x.kelas=k||null;x.lv=l}}
async function resetS(id){if(!confirm('Reset semua progres siswa ini? Tindakan ini tidak bisa dibatalkan.'))return;const x=all.find(i=>i.id==id);
 const{data,error}=await sb.from('profiles').update({p:{},lv:0,placed:false,pt:null}).eq('id',id).select();
 if(error||!data||!data.length)return document.getElementById('dm').textContent='Gagal reset. Pastikan supabase-update-1.sql sudah dijalankan.';
 Object.assign(x,{p:{},lv:0,placed:false,pt:null});detail(id)}
document.addEventListener('click',e=>{const d=document.getElementById('dd');if(d&&!e.target.closest('.hb')&&!e.target.closest('#dd')){d.style.display='none';d.dataset.w=''}});
init();
</script></body></html>
